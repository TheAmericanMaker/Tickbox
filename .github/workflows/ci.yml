name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reports style violations without blocking the build. It becomes a gating step
  # once an initial ktlintFormat commit has brought the codebase clean.
  ktlint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint (advisory)
        run: ./gradlew --no-daemon ktlintCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      # Still built, because packaging is a real check — resource merging, manifest
      # merging and dexing all fail here rather than at compile time. The APK just
      # is not uploaded: at ~32 MB a run it was the whole of this repo's Actions
      # storage, and a debug build is a `./gradlew assembleDebug` away locally.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
