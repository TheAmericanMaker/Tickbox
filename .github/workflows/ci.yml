name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reports style violations without blocking the build. It becomes a gating step
  # once an initial ktlintFormat commit has brought the codebase clean.
  ktlint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: ktlint (advisory)
        run: ./gradlew --no-daemon ktlintCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Actions cache is capped at 10 GB per repository and this build filled 8 GB
      # of it: gradle/actions splits Gradle home into artifact bundles, and the
      # dependencies and transforms bundles alone run ~400-500 MB *each*, with a
      # fresh entry per distinct dependency set. Dependabot churn multiplies that.
      # Minutes are unmetered on a public repo, so trading build time for cache is
      # free here. If CI ever feels too slow, `cache-cleanup: on-success` is the
      # middle ground — it shrinks entries rather than removing them.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      # Still built, because packaging is a real check — resource merging, manifest
      # merging and dexing all fail here rather than at compile time. The APK just
      # is not uploaded: 48 copies at ~31 MB had accumulated and none was ever
      # downloaded, and a debug build is a `./gradlew assembleDebug` away locally.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
