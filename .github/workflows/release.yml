name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Catches the most common release mistake: tagging without bumping versionName.
      - name: Verify tag matches versionName
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VN" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName v$VN" >&2
            exit 1
          fi

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleWithOcrRelease assembleNoOcrRelease

      # Each APK is named explicitly. Globbing would now match five files per flavour — the
      # ABI splits — and `cp a b c dest.apk` fails outright rather than picking one.
      #
      # Not every built APK is published. x86/x86_64 are emulator-only for a phone app, and
      # splitting noOcr saves ~100 KB because it has almost no native code, so only its
      # universal APK is worth offering. Anyone who needs the rest can build them.
      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          W=app/build/outputs/apk/withOcr/release
          N=app/build/outputs/apk/noOcr/release
          cp "$W/app-withOcr-universal-release.apk"    "dist/tickbox-$GITHUB_REF_NAME.apk"
          cp "$W/app-withOcr-arm64-v8a-release.apk"    "dist/tickbox-$GITHUB_REF_NAME-arm64-v8a.apk"
          cp "$W/app-withOcr-armeabi-v7a-release.apk"  "dist/tickbox-$GITHUB_REF_NAME-armeabi-v7a.apk"
          cp "$N/app-noOcr-universal-release.apk"      "dist/tickbox-$GITHUB_REF_NAME-noocr.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      # Draft on purpose: install and smoke-test the exact artifact before publishing.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
