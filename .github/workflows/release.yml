name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Catches the most common release mistake: tagging without bumping versionName.
      - name: Verify tag matches versionName
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VN" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName v$VN" >&2
            exit 1
          fi

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleWithOcrRelease assembleNoOcrRelease

      # Two APKs now, so each is named explicitly rather than globbed onto one filename.
      # The old loop renamed every match to tickbox-$TAG.apk and would silently have kept
      # whichever landed last.
      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/withOcr/release/*.apk "dist/tickbox-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/noOcr/release/*.apk "dist/tickbox-$GITHUB_REF_NAME-noocr.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      # Draft on purpose: install and smoke-test the exact artifact before publishing.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
